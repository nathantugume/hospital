name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hospital-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'
  APP_URL: https://hospital.alwaysdata.net

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite
          php artisan migrate --force

      - name: Check PHP syntax
        run: find app config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run Laravel tests
        run: php artisan test --without-tty

  deploy:
    name: Deploy to Alwaysdata
    needs: quality
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build production assets
        run: |
          npm ci
          npm run build

      - name: Install SSH password helper
        run: sudo apt-get update && sudo apt-get install --yes sshpass

      - name: Create production environment file
        env:
          APP_KEY: ${{ secrets.LARAVEL_APP_KEY }}
        run: |
          test -n "$APP_KEY"
          printf '%s\n' \
            'APP_NAME=Hospital' \
            'APP_ENV=production' \
            'APP_DEBUG=false' \
            "APP_KEY=$APP_KEY" \
            "APP_URL=${APP_URL}" \
            "ASSET_URL=${APP_URL}" \
            'LOG_CHANNEL=stack' \
            'LOG_LEVEL=error' \
            'DB_CONNECTION=sqlite' \
            'DB_DATABASE=/home/hospital/shared/database/database.sqlite' \
            'SESSION_DRIVER=database' \
            'CACHE_STORE=database' \
            'QUEUE_CONNECTION=sync' \
            'MAIL_MAILER=log' > /tmp/hospital.env

      - name: Package release
        run: |
          rm -rf /tmp/hospital-release
          mkdir -p /tmp/hospital-release
          tar \
            --exclude='.git' \
            --exclude='.env*' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='storage' \
            --exclude='public/storage' \
            --exclude='bootstrap/cache' \
            --exclude='public/hot' \
            -cf - . | tar -xf - -C /tmp/hospital-release
          cp /tmp/hospital.env /tmp/hospital-release/.env
          tar -czf /tmp/hospital-release.tgz -C /tmp/hospital-release .

      - name: Upload release archive
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.ALWAYSDATA_SSH_HOST }}
          SSH_USER: ${{ secrets.ALWAYSDATA_SSH_USER }}
        run: |
          test -n "$SSHPASS"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          ssh_opts=(-4 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/hospital-known-hosts)
          sshpass -e ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            'mkdir -p /home/hospital/releases /home/hospital/shared/database /home/hospital/shared/storage'
          sshpass -e ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            'cat > /home/hospital/hospital-release.tgz' < /tmp/hospital-release.tgz

      - name: Install and publish release
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.ALWAYSDATA_SSH_HOST }}
          SSH_USER: ${{ secrets.ALWAYSDATA_SSH_USER }}
        run: |
          test -n "$SSHPASS"
          ssh_opts=(-4 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/hospital-known-hosts)
          sshpass -e ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail

          HOME_DIR=/home/hospital
          ARCHIVE="$HOME_DIR/hospital-release.tgz"
          STAMP="$(date +%Y%m%d%H%M%S)"
          RELEASE="$HOME_DIR/releases/$STAMP"
          SHARED="$HOME_DIR/shared"

          mkdir -p "$RELEASE" "$SHARED/database" "$SHARED/storage/app/public" \
            "$SHARED/storage/framework/cache/data" "$SHARED/storage/framework/sessions" \
            "$SHARED/storage/framework/testing" "$SHARED/storage/framework/views" "$SHARED/storage/logs"
          tar -xzf "$ARCHIVE" -C "$RELEASE"
          mkdir -p "$RELEASE/bootstrap/cache"
          rm -rf "$RELEASE/storage"
          ln -s "$SHARED/storage" "$RELEASE/storage"
          touch "$SHARED/database/database.sqlite"

          cd "$RELEASE"
          /usr/bin/composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-req=php
          /usr/bin/php artisan migrate --force
          /usr/bin/php artisan optimize:clear
          /usr/bin/php artisan storage:link
          /usr/bin/php artisan config:cache
          /usr/bin/php artisan route:cache
          /usr/bin/php artisan view:cache
          chmod -R u+rwX,go-rwx "$RELEASE/storage" "$RELEASE/bootstrap/cache"

          if [ -e "$HOME_DIR/www" ] || [ -L "$HOME_DIR/www" ]; then
            mv "$HOME_DIR/www" "$HOME_DIR/www.previous.$STAMP"
          fi
          ln -s "$RELEASE/public" "$HOME_DIR/www"
          rm -f "$ARCHIVE"

          find "$HOME_DIR/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf
          REMOTE_SCRIPT

      - name: Smoke test production site
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output /dev/null --write-out 'home_http=%{http_code}\n' "$APP_URL/"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output /dev/null --write-out 'login_http=%{http_code}\n' "$APP_URL/login"
