name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meditrack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  APP_URL: https://hospital.alwaysdata.net

jobs:
  quality:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, zip, xml
          coverage: none
          tools: composer:v2
          cache: composer

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install PHP dependencies
        # The source lockfile currently contains Laravel 11 releases flagged by Composer advisories.
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-blocking

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan optimize:clear

      - name: Validate Laravel production caches
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize:clear

      - name: Validate route registration
        run: php artisan route:list --except-vendor

      - name: Check PHP syntax
        run: find app config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run Laravel tests
        run: php artisan test --without-tty

      - name: Report dependency advisories
        continue-on-error: true
        run: composer audit --format=summary

  deploy:
    name: Deploy to Alwaysdata
    needs: quality
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH password helper
        run: sudo apt-get update && sudo apt-get install --yes sshpass

      - name: Create production environment file
        env:
          APP_KEY: ${{ secrets.LARAVEL_APP_KEY }}
        run: |
          test -n "$APP_KEY"
          printf '%s\n' \
            'APP_NAME=MediTrack HMS' \
            'APP_ENV=production' \
            'APP_DEBUG=false' \
            "APP_KEY=$APP_KEY" \
            "APP_URL=${APP_URL}" \
            "ASSET_URL=${APP_URL}" \
            "FRONTEND_URL=${APP_URL}" \
            'APP_TIMEZONE=Africa/Kampala' \
            'DB_CONNECTION=sqlite' \
            'DB_DATABASE=/home/hospital/shared/meditrack/database.sqlite' \
            'CACHE_STORE=file' \
            'SESSION_DRIVER=file' \
            'QUEUE_CONNECTION=sync' \
            'MAIL_MAILER=log' \
            'ENABLE_SMS_NOTIFICATIONS=false' \
            'ENABLE_MOBILE_MONEY=false' \
            'ENABLE_INSURANCE_INTEGRATION=false' \
            'ENABLE_ID_VERIFICATION=false' \
            'ENABLE_LIS_INTEGRATION=false' \
            'ENABLE_PHARMACY_SUPPLY_CHAIN=false' \
            'ENABLE_AMBULANCE_GPS=false' \
            'ENABLE_TWILIO_EMERGENCY=false' > /tmp/meditrack.env

      - name: Package release
        run: |
          rm -rf /tmp/meditrack-release
          mkdir -p /tmp/meditrack-release
          tar \
            --exclude='.git' \
            --exclude='.env*' \
            --exclude='vendor' \
            --exclude='storage' \
            --exclude='bootstrap/cache' \
            --exclude='database/*.sqlite' \
            --exclude='.phpunit.cache' \
            -cf - . | tar -xf - -C /tmp/meditrack-release
          cp /tmp/meditrack.env /tmp/meditrack-release/.env
          tar -czf /tmp/meditrack-release.tgz -C /tmp/meditrack-release .

      - name: Upload release archive
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.ALWAYSDATA_SSH_HOST }}
          SSH_USER: ${{ secrets.ALWAYSDATA_SSH_USER }}
        run: |
          test -n "$SSHPASS"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          ssh_opts=(-4 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/meditrack-known-hosts)
          sshpass -e ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            'mkdir -p /home/hospital/releases /home/hospital/shared/meditrack/storage/app/public /home/hospital/shared/meditrack/storage/framework/cache/data /home/hospital/shared/meditrack/storage/framework/sessions /home/hospital/shared/meditrack/storage/framework/views /home/hospital/shared/meditrack/storage/logs'
          sshpass -e ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            'cat > /home/hospital/meditrack-release.tgz' < /tmp/meditrack-release.tgz

      - name: Install and publish release
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.ALWAYSDATA_SSH_HOST }}
          SSH_USER: ${{ secrets.ALWAYSDATA_SSH_USER }}
        run: |
          test -n "$SSHPASS"
          ssh_opts=(-4 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/meditrack-known-hosts)
          sshpass -e ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail

          HOME_DIR=/home/hospital
          ARCHIVE="$HOME_DIR/meditrack-release.tgz"
          STAMP="$(date +%Y%m%d%H%M%S)"
          RELEASE="$HOME_DIR/releases/$STAMP"
          SHARED="$HOME_DIR/shared/meditrack"

          mkdir -p "$RELEASE" "$SHARED" "$SHARED/storage/app/public" \
            "$SHARED/storage/framework/cache/data" "$SHARED/storage/framework/sessions" \
            "$SHARED/storage/framework/views" "$SHARED/storage/logs"
          tar -xzf "$ARCHIVE" -C "$RELEASE"
          mkdir -p "$RELEASE/bootstrap/cache"
          rm -rf "$RELEASE/storage"
          ln -s "$SHARED/storage" "$RELEASE/storage"
          touch "$SHARED/database.sqlite"

          cd "$RELEASE"
          /usr/bin/composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-blocking --ignore-platform-req=ext-pcntl
          /usr/bin/php artisan optimize:clear
          /usr/bin/php artisan migrate --force
          /usr/bin/php artisan config:cache
          /usr/bin/php artisan route:cache
          /usr/bin/php artisan view:cache
          /usr/bin/php artisan storage:link || true

          if [ -e "$HOME_DIR/www" ] || [ -L "$HOME_DIR/www" ]; then
            mv "$HOME_DIR/www" "$HOME_DIR/www.previous.$STAMP"
          fi
          ln -s "$RELEASE/public" "$HOME_DIR/www"
          rm -f "$ARCHIVE"

          find "$HOME_DIR/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf
          REMOTE_SCRIPT

      - name: Smoke test production site
        run: |
          home_code="$(curl --silent --show-error --retry 3 --retry-all-errors --output /dev/null --write-out '%{http_code}' "$APP_URL/")"
          login_code="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors --output /dev/null --write-out '%{http_code}' "$APP_URL/login")"
          asset_code="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors --output /dev/null --write-out '%{http_code}' "$APP_URL/blade.css")"
          health_code="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors --output /dev/null --write-out '%{http_code}' "$APP_URL/api/v1/health")"
          test "$home_code" = 302
          test "$login_code" = 200
          test "$asset_code" = 200
          test "$health_code" = 200
          printf 'protected_home=%s login=%s asset=%s health=%s\n' "$home_code" "$login_code" "$asset_code" "$health_code"
