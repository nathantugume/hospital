[program:meditrack-worker-default]
command=php /var/www/html/artisan queue:work redis --queue=default --tries=3 --timeout=60
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/www/html/storage/logs/worker-default.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/html/storage/logs/worker-default-error.log
stderr_logfile_maxbytes=10MB

[program:meditrack-worker-sms]
command=php /var/www/html/artisan queue:work redis --queue=sms --tries=3 --timeout=30
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
numprocs=3
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/www/html/storage/logs/worker-sms.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/html/storage/logs/worker-sms-error.log
stderr_logfile_maxbytes=10MB

[program:meditrack-worker-payments]
command=php /var/www/html/artisan queue:work redis --queue=payments --tries=3 --timeout=300
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/www/html/storage/logs/worker-payments.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/html/storage/logs/worker-payments-error.log
stderr_logfile_maxbytes=10MB

[program:meditrack-worker-integrations]
command=php /var/www/html/artisan queue:work redis --queue=integrations --tries=3 --timeout=600
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/www/html/storage/logs/worker-integrations.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/html/storage/logs/worker-integrations-error.log
stderr_logfile_maxbytes=10MB

[program:meditrack-horizon]
command=php /var/www/html/artisan horizon
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/www/html/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/html/storage/logs/horizon-error.log
stderr_logfile_maxbytes=10MB

[program:meditrack-octane]
command=php /var/www/html/artisan octane:start --server=swoole --host=127.0.0.1 --port=8000 --max-requests=1000
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/www/html/storage/logs/octane.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/www/html/storage/logs/octane-error.log
stderr_logfile_maxbytes=10MB

# Event group — stop all workers together
[group:meditrack]
programs=meditrack-worker-default,meditrack-worker-sms,meditrack-worker-payments,meditrack-worker-integrations,meditrack-horizon,meditrack-octane
